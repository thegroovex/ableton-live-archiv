<!doctype html>
<html><head><meta charset="utf-8"><title>Live Archiv</title>
<style>
  html,body{height:100%;margin:0;background:#121317;color:#ddd;font:14px -apple-system,"Segoe UI",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .icon{width:112px;height:112px}
  h1{font-size:24px;font-weight:700;letter-spacing:.18em;margin:0;color:#fff}
  .bar{width:220px;height:3px;background:#2a2c33;overflow:hidden;border-radius:2px}
  .bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,#FF7A18,#FF2D6F 55%,#B14BFF);animation:m 1.1s infinite ease-in-out}
  @keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  p{margin:0;color:#8a8f99}
  .brand{position:fixed;bottom:22px;width:210px;opacity:.9}
</style></head>
<body>
<img class="icon" src="app-icon.png" alt="">
<h1>LIVE ARCHIV</h1><div class="bar"><i></i></div><p id="m">Startet …</p>
<img class="brand" src="brand-logo.svg" alt="BeatTactics – designed by groovex">
<script>if(!(navigator.language||"").toLowerCase().startsWith("de"))document.getElementById("m").textContent="Starting …";</script>
</body></html>
