<!doctype html>
<html><head><meta charset="utf-8"><title>Live Archiv</title>
<style>
  html,body{height:100%;margin:0;background:#1b1b1b;color:#ddd;font:14px -apple-system,"Segoe UI",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  h1{font-size:22px;font-weight:600;letter-spacing:.5px;margin:0;color:#ff9e2c}
  .bar{width:220px;height:3px;background:#333;overflow:hidden;border-radius:2px}
  .bar i{display:block;width:40%;height:100%;background:#ff9e2c;animation:m 1.1s infinite ease-in-out}
  @keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  p{margin:0;color:#888}
</style></head>
<body><h1>Live Archiv</h1><div class="bar"><i></i></div><p id="m">Startet …</p>
<script>if(!(navigator.language||"").toLowerCase().startsWith("de"))document.getElementById("m").textContent="Starting …";</script>
</body></html>
